version: '3.8'

services:
  tooncar-racing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tooncar-racing-3d
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # Subpath deploy example: VITE_BASE_PATH=/ralli/ and BASE_PATH=/ralli
      # Leave empty for root (http://ip:port/)
      VITE_BASE_PATH: ${VITE_BASE_PATH:-./}
      BASE_PATH: ${BASE_PATH:-}
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/rooms"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
